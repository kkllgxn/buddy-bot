# 喵喵旅行每日任务（GitHub Actions 云端定时，不依赖本地电脑开机）
# 时区说明：GitHub cron 用的是 UTC，北京时间 = UTC + 8
name: Buddy Travel Daily

on:
  schedule:
    - cron: "30 1 * * *"   # 北京时间 每天 09:30 —— 签到 + 领礼物 + 派出行
    - cron: "30 11 * * *"  # 北京时间 每天 19:30 —— 晚间兜底领礼物
  workflow_dispatch: {}    # 允许在 Actions 页面手动点「Run workflow」
  push: {}                 # 任何文件更新都会触发一次运行（WorkBuddy 也可借此远程触发）

permissions:
  contents: write          # 运行结束后要把 result.log 提交回仓库

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai   # 让日志时间戳显示北京时间（定时触发时间本就按北京时间换算，不受影响）
    steps:
      - uses: actions/checkout@v5

      - name: Run buddy travel daily task
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) T="定时任务" ;;
            workflow_dispatch) T="手动" ;;
            *) T="代码更新" ;;
          esac
          STAMP="$(date '+%Y-%m-%d %H:%M:%S')（$T）"
          node daily.js 2>&1 | tee run_current.log
          PIPE=${PIPESTATUS[0]}   # 保证脚本的退出码不被 tee 吞掉
          # 组装 result.log：本次记录 + 之前最多 4 次 = 滚动保留最近 5 次
          RUN_HEADER="================ 运行时间: ${STAMP} ================" node -e '
            const fs = require("fs");
            const read = (p) => { try { return fs.readFileSync(p, "utf8"); } catch { return ""; } };
            const cur = process.env.RUN_HEADER + "\n" + read("run_current.log").replace(/\n*$/, "\n");
            const chunks = read("result.log").split(/(================ 运行时间:[^\n]*================\n)/);
            const entries = [];
            for (let i = 1; i < chunks.length; i += 2) entries.push(chunks[i] + chunks[i + 1].replace(/\n+$/, "\n"));
            const kept = entries.slice(-4);
            const out = [cur, ...kept].join("\n");
            fs.writeFileSync("result.log", out.endsWith("\n") ? out : out + "\n");
          '
          exit $PIPE
        env:
          BUDDY_TOKEN: ${{ secrets.BUDDY_TOKEN }}

      # 把运行日志提交回仓库（GITHUB_TOKEN 的提交不会再次触发工作流，无循环风险）
      - name: Commit run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.log
          git commit -m "run log $(date '+%m-%d %H:%M')" || echo "no changes"
          git push || echo "push skipped"

      # 成功/失败都发邮件到你的邮箱（需配置 MAIL_USER / MAIL_PASS 两个 Secret）
      - name: Email run result
        if: always()
        continue-on-error: true   # 邮件未配置/发送失败不影响任务结果
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.qq.com        # 163 邮箱改为 smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }} # 是 SMTP 授权码，不是邮箱登录密码
          to: ${{ secrets.MAIL_USER }}
          from: ${{ secrets.MAIL_USER }}
          subject: "喵喵旅行每日任务${{ github.event_name == 'schedule' && '（定时任务）' || github.event_name == 'workflow_dispatch' && '（手动）' || '（代码更新）' }} - ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}"
          body: file://run_current.log
