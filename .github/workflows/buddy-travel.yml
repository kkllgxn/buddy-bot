# 喵喵旅行每日任务（GitHub Actions 云端定时，不依赖本地电脑开机）
# 时区说明：GitHub cron 用的是 UTC，北京时间 = UTC + 8
name: Buddy Travel Daily

on:
  schedule:
    - cron: "30 1 * * *"   # 北京时间 每天 09:30 —— 先领礼物 + 派出行
    - cron: "30 11 * * *"  # 北京时间 每天 19:30 —— 晚间兜底领礼物
  workflow_dispatch: {}    # 允许在 Actions 页面手动点「Run workflow」测试

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run buddy travel daily task
        run: node daily.js
        env:
          BUDDY_TOKEN: ${{ secrets.BUDDY_TOKEN }}
